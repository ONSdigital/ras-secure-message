name: Check helm chart version

on:
  pull_request:
    branches: [ main ]

env:
  CHART_DIRECTORY: _infra/helm/secure-message
  CHART_FILE: _infra/helm/secure-message/Chart.yaml

jobs:
  build:
    name: Check chart version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683	 # v4.2.2
        with:
          fetch-depth: '0'
          token: ${{ secrets.BOT_TOKEN }}

      - name: Chart.yaml version check
        shell: bash
        run: |
          set -euo pipefail

          extract_chart_version() {
            awk -F': *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' "$1"
          }
          
          extract_app_version() {
            awk -F': *' '$1 == "appVersion" { gsub(/"/, "", $2); print $2; exit }' "$1"
          }

          to_number() {
            local v="$1"
            [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || return 1
            printf '%03d%03d%03d\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}"
          }

          CURRENT_VERSION=$(extract_chart_version "$CHART_FILE")
          CURRENT_APP_VERSION=$(extract_app_version "$CHART_FILE")
          
          if [ "$CURRENT_VERSION" != "$CURRENT_APP_VERSION" ]; then
            echo "::error file=$CHART_FILE::Chart.yaml appVersion ($CURRENT_APP_VERSION) and version ($CURRENT_VERSION) must match."
            exit 1
          fi

          echo "Current Chart.yaml version: $CURRENT_VERSION"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE_VERSION=$(git show "origin/${{ github.base_ref }}:$CHART_FILE" | awk -F': *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }')
          else
            BASE_VERSION=$(git show "${{ github.event.before }}:$CHART_FILE" | awk -F': *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }')
          fi

          echo "Previous Chart.yaml version: $BASE_VERSION"

          IFS='.' read -r CURRENT_MAJOR CURRENT_MINOR CURRENT_PATCH <<< "$CURRENT_VERSION"
          IFS='.' read -r BASE_MAJOR BASE_MINOR BASE_PATCH <<< "$BASE_VERSION"


          if (( CURRENT_MAJOR < BASE_MAJOR )) || \
             (( CURRENT_MAJOR == BASE_MAJOR && CURRENT_MINOR < BASE_MINOR )) || \
             (( CURRENT_MAJOR == BASE_MAJOR && CURRENT_MINOR == BASE_MINOR && CURRENT_PATCH <= BASE_PATCH )); then
            echo "::error file=$CHART_FILE::The Helm chart version must increase."
            exit 1
          fi

          echo "Chart.yaml version increased from $BASE_VERSION to $CURRENT_VERSION"